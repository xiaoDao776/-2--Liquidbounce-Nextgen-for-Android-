#
# Android Compatibility Properties for LiquidBounce NextGen
# Add these to your gradle.properties or pass via -P when building for Android
#

# Android compatibility mode - enables Android-specific optimizations
liquidbounce.android.compat=true

# Enable touch input support for Android
liquidbounce.android.touch_input=true

# Disable features not available on Android
liquidbounce.android.disable_jcef=true
liquidbounce.android.disable_discord_rpc=true
liquidbounce.android.disable_deep_learning=true

# Memory optimizations for low-end Android devices
liquidbounce.android.memory_optimized=true

# Use OpenGL ES 3.0 compatible shaders (required for PojavLauncher)
liquidbounce.android.gles_compat=true

# Reduce texture sizes for lower memory usage
liquidbounce.android.reduce_textures=true

# Enable Android-specific logging
liquidbounce.android.debug_logging=false

# Target Android SDK version (for reference, not used directly by Fabric)
liquidbounce.android.target_sdk=34

# Minimum Android SDK version
liquidbounce.android.min_sdk=26

# PojavLauncher compatible mode
liquidbounce.android.pojav_compat=true

# ZalithLauncher compatible mode
liquidbounce.android.zalith_compat=true
